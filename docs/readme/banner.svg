<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="300" rx="0" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- background -->
    <rect x="0" y="0" width="1200" height="300" fill="#FAF6EF" />

    <!-- soft decorative blobs -->
    <circle cx="120" cy="260" r="150" fill="#6FC1E8" opacity="0.10" />
    <circle cx="980" cy="20" r="120" fill="#F0A8B4" opacity="0.10" />

    <!-- left: wordmark -->
    <g>
      <path d="M78 92 L86 108 L102 116 L86 124 L78 140 L70 124 L54 116 L70 108 Z" fill="#6FC1E8" />
      <text x="118" y="128" font-size="52" font-weight="700" fill="#23262B">codelette</text>
      <text x="120" y="164" font-size="20" fill="#6B7280">약어를 검색하면, 원어와 뜻이 바로 보여요</text>
      <text x="120" y="192" font-size="16" fill="#9AA0A8">코드 학습을 위한 작은 위젯</text>
    </g>

    <!-- right: product card -->
    <g>
      <rect x="700" y="55" width="430" height="190" rx="22" fill="#FFFFFF" stroke="#ECE7DC" stroke-width="1.5" />

      <!-- card header -->
      <path d="M726 82 L731 91 L740 96 L731 101 L726 110 L721 101 L712 96 L721 91 Z" fill="#6FC1E8" />
      <text x="748" y="102" font-size="17" font-weight="700" fill="#23262B">codelette</text>
      <circle cx="1060" cy="96" r="7" fill="#F5C84C" />
      <circle cx="1084" cy="96" r="7" fill="#F0A8B4" />
      <circle cx="1108" cy="96" r="7" fill="#FAF6EF" stroke="#23262B" stroke-width="1.5" />

      <!-- search pill -->
      <rect x="726" y="122" width="366" height="46" rx="23" fill="#FFFFFF" stroke="#E5E1D6" stroke-width="1.5" />
      <text x="748" y="152" font-size="19" fill="#23262B">div</text>
      <rect x="1000" y="129" width="78" height="32" rx="16" fill="#6FC1E8" />
      <text x="1039" y="151" font-size="14" fill="#FFFFFF" text-anchor="middle">검색</text>

      <line x1="726" y1="188" x2="1092" y2="188" stroke="#EFEAE0" stroke-width="1.5" />

      <text x="726" y="218" font-size="24" font-weight="700" fill="#23262B">division</text>
      <rect x="864" y="201" width="52" height="22" rx="11" fill="#FCE7DA" />
      <text x="890" y="216" font-size="12" fill="#B5643A" text-anchor="middle">HTML</text>
      <text x="726" y="238" font-size="15" fill="#8A8F98">구역, 구분, 나뉜 부분</text>
    </g>
  </g>
</svg>
